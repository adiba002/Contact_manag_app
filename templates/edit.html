<!DOCTYPE html>
<html>
<head>
    <title>Edit Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card p-4">
        <h3>Edit Contact</h3>

        <form action="/update/{{index}}" method="POST">
            <div class="row">
                <div class="col">
                    <input name="first" value="{{contact.first}}" class="form-control" required>
                </div>
                <div class="col">
                    <input name="last" value="{{contact.last}}" class="form-control" required>
                </div>
            </div>

            <input name="email" value="{{contact.email}}" class="form-control mt-2" required>
            <input name="phone" value="{{contact.phone}}" class="form-control mt-2" required>

            <button class="btn btn-primary mt-3">Update</button>
            <a href="/" class="btn btn-secondary mt-3">Back</a>
        </form>
    </div>

</div>

</body>
</html>
