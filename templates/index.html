<!DOCTYPE html>
<html>
<head>
    <title>Contact App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4">Contact Management Application</h2>

    <div class="card p-4 mb-4">
        <div class="text-center">
            
            <h4>Add Contact</h4>
        </div>
        <form action="/add" method="POST">
            <div class="row">
                <div class="col">
                    <input name="first" class="form-control" placeholder="First Name" required>
                </div>
                <div class="col">
                    <input name="last" class="form-control" placeholder="Last Name" required>
                </div>
            </div>

            <input name="email" class="form-control mt-2" placeholder="Email" required>
            <input name="phone" class="form-control mt-2" placeholder="Phone" required>
            <div class="text-center mt-3">

                <button class="btn btn-success mt-3 ">Add Contact Details</button>
            </div>
        </form>
    </div>

    <div class="card p-4">
        <h4>Contact List</h4>

        <table class="table table-striped mt-3">
            <thead class="table-dark">
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
            {% for c in contacts %}
                <tr>
                    <td>{{c.first}} {{c.last}}</td>
                    <td>{{c.email}}</td>
                    <td>{{c.phone}}</td>
                    <td>
                        <a href="/edit/{{loop.index0}}" class="btn btn-warning btn-sm">Edit</a>
                        <a href="/delete/{{loop.index0}}" class="btn btn-danger btn-sm">Delete</a>
                    </td>
                </tr>
            {% endfor %}
            </tbody>
        </table>

    </div>

</div>

</body>
</html>
